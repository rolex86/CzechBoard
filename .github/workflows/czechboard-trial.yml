name: CzechBoard trial APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/czech-autocorrect-v0.1
    paths:
      - '.github/workflows/czechboard-trial.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle*'
      - 'settings.gradle*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.0.13004108"
      - name: Build side-by-side debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK does not request INTERNET permission
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: APK requests INTERNET permission" >&2
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep '^package:'
      - uses: actions/upload-artifact@v4
        with:
          name: CzechBoard-v0.1-baseline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
